# Defaults for bvi.launch.py (launch arguments override difficulty/seed).
bvi_planner:
  ros__parameters:
    difficulty: medium        # easy | medium | hard  (quantile-selected seeds)
    seed: -1                  # >= 0 overrides difficulty with an explicit map seed
    start: [1, 1]             # [x, y] cell
    goal: [28, 28]            # [x, y] cell
    resolution: 1.0           # metres per cell
    show_text: true           # integer J labels on every cell
    seconds_per_move: 0.4     # must equal 1 / robot rate_hz

bvi_robot:
  ros__parameters:
    label: BVI
    color: "#1c7ed6"
    path_topic: bvi_path
    marker_topic: bvi_robot
    rate_hz: 2.5
    lateral_offset: -0.18
    label_offset_y: -1.0
    loop: true
    hold_at_goal_s: 3.0

abvi_robot:
  ros__parameters:
    label: ABVI
    color: "#e8590c"
    path_topic: abvi_path
    marker_topic: abvi_robot
    rate_hz: 2.5
    lateral_offset: 0.18
    label_offset_y: 1.0
    loop: true
    hold_at_goal_s: 3.0
